[build]
  command = "yarn run build"
  functions = "netlify/functions"
  publish = "dist"

# Ensure the manifest is served with the right type and NO cache
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# Ensure the service worker is never cached by the CDN
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 1. API Proxy (Must be ABOVE the SPA redirect)
[[redirects]]
  from = "/api/*"
  to = "https://psychological-sybil-phoenix-inc-0c1104e5.koyeb.app/:splat"
  status = 200
  force = true

# 2. SPA Redirect (Catch-all)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200